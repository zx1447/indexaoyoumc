# ============================================
# docker-compose.yml for Pathfinder Pro 2025
# ============================================
# Usage:
#   1. Put index.js + package.json + Dockerfile in the same directory
#   2. docker compose up -d --build
#   3. Access: http://SERVER_IP:4237  (default password: 1715)
#
# Data persistence:
#   All config and runtime data is stored in the named volume `app_data`,
#   which maps to /app/node_modules inside the container.
#   This survives container rebuilds and restarts.

services:
  pathfinder:
    build:
      context: .
      dockerfile: Dockerfile
    # If you've pushed to a registry instead, comment out `build:` and use:
    # image: ghcr.io/yourname/pathfinder-pro:latest
    container_name: pathfinder-pro
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-4237}:4237"

    environment:
      - SERVER_PORT=4237
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # Uncomment to override the default port inside the container:
      # - SERVER_PORT=8080

    volumes:
      # Persist ALL app data (bot configs, task center, nezha, proxy,
      # downloaded binaries, referral accounts, welcome voice, etc.)
      # On first run, Docker auto-copies the image's node_modules content
      # into this volume, so npm packages are preserved.
      - app_data:/app/node_modules

    # ---- Signal & shutdown tuning ----
    # The app intercepts SIGTERM when "system guard" is enabled.
    # Give it 15s to shut down gracefully, then force-kill.
    stop_grace_period: 15s
    stop_signal: SIGTERM

    # ---- Resource limits (optional, adjust to your server) ----
    # The app spawns child processes (cloudflared, xray, firefox, etc.)
    # so it can be memory-hungry. 512MB is a reasonable minimum.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    # ---- Health check (optional) ----
    # Checks if the web panel is responding
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4237/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # ---- Security (optional but recommended) ----
    # The app needs to spawn child processes and download binaries,
    # so we can't lock down too aggressively. These are safe defaults.
    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
    driver: local
