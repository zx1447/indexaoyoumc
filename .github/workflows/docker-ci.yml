name: Docker Image CI

# ============================================================
# PR 校验：Hadolint + 测试构建 + 冒烟测试
# 不推送镜像，只验证 Dockerfile 能跑通
# ============================================================
on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'index.js'
      - 'package.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3013

  test-build:
    name: Test Build + Smoke Test
    runs-on: ubuntu-latest
    needs: hadolint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: pathfinder-pro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          echo "[smoke-test] Starting container..."
          docker run -d --name smoke-test -p 14237:4237 pathfinder-pro:test
          sleep 10
          echo "[smoke-test] Checking if HTTP server responds..."
          if curl -sf http://localhost:14237/ > /dev/null 2>&1; then
            echo "[smoke-test] ✅ HTTP server responding"
          else
            echo "[smoke-test] ❌ HTTP server not responding"
            docker logs smoke-test
            docker rm -f smoke-test
            exit 1
          fi
          echo "[smoke-test] Container logs:"
          docker logs smoke-test | tail -20
          docker rm -f smoke-test
