# ============================================================
# docker-compose.ghcr.yml — 镜像部署版（拉 GHCR 镜像，不用本地构建）
# ============================================================
# 用法：
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
# ============================================================
# 镜像地址：ghcr.io/zx1447/indexaoyoumc
# 首次拉取前需要登录 GHCR：
#   echo $GITHUB_TOKEN | docker login ghcr.io -u zx1447 --password-stdin

services:
  pathfinder:
    image: ghcr.io/zx1447/indexaoyoumc:latest
    container_name: pathfinder-pro
    restart: unless-stopped
    pull_policy: always

    ports:
      - "${HOST_PORT:-4237}:4237"

    environment:
      - SERVER_PORT=4237
      - NODE_ENV=production
      - TZ=Asia/Shanghai

    volumes:
      - app_data:/app/node_modules

    stop_grace_period: 15s
    stop_signal: SIGTERM

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4237/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true

volumes:
  app_data:
    driver: local
